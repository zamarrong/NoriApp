name: nori_mobile
description: "Nori móvil: venta en ruta, inventario y supervisión sobre la API v1 de nori-web."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Estado y navegación
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  # Red y almacenamiento
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  sqflite: ^2.4.1
  path: ^1.9.0
  uuid: ^4.5.1
  connectivity_plus: ^6.1.0

  # Dispositivo
  local_auth: ^2.3.0
  geolocator: ^13.0.2
  mobile_scanner: ^7.0.0
  image_picker: ^1.1.2
  share_plus: ^10.1.2
  url_launcher: ^6.3.1
  flutter_local_notifications: ^18.0.1
  device_info_plus: ^11.1.1

  # Mapa (OpenStreetMap, sin llave)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
