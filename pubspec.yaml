name: nori_mobile
description: "Nori móvil: venta en ruta, inventario y supervisión sobre la API v1 de nori-web."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Estado y navegación
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  # Red y almacenamiento
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  sqflite: ^2.4.1
  path: ^1.9.0
  uuid: ^4.5.1
  connectivity_plus: ^6.1.0

  # Dispositivo
  local_auth: ^2.3.0
  geolocator: ^13.0.2
  mobile_scanner: ^7.0.0
  image_picker: ^1.1.2
  share_plus: ^10.1.2
  url_launcher: ^6.3.1
  flutter_local_notifications: ^18.0.1
  device_info_plus: ^11.1.1

  # Mapa (OpenStreetMap, sin llave)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  intl: ^0.20.2
  flutter_svg: ^2.3.0
  flutter_blue_plus: ^1.36.8
  print_bluetooth_thermal: ^1.2.1
  permission_handler: ^13.0.2
  image: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.4
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

# App icon: option C of store/play (the "n" of the wordmark with the cloud dot); sources in store/play/src/app-icon*.svg
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  adaptive_icon_foreground_inset: 0 # the artwork already keeps the 66/108 safe zone
  adaptive_icon_monochrome: assets/icon/app_icon_monochrome.png

dependency_overrides:
  # 14.x needs Android Gradle Plugin 9 (built-in Kotlin); this project is on AGP 8.11
  permission_handler_android: 13.0.1
